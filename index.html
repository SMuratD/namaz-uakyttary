<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Намазға уақыт болды</title>
<style>
  :root{
    /* Background */
    --bg-0: #0A1120;
    --bg-1: #101B30;
    --bg-2: #16233B;
    --bg-3: #1C2B45;

 /* Panels */
    --panel: rgba(255,255,255,0.035);
    --panel-hover: rgba(255,255,255,0.055);
    --panel-active: rgba(201,164,76,0.08);
    --panel-border: rgba(255,255,255,0.09);
    --panel-border-hover: rgba(201,164,76,0.35);

/* Text */
    --ink: #F1EADD;
    --ink-bright: #FFFFFF;
    --muted: #7C8699;
    --muted-2: #4E5768;

/* Status */
    --success: #55C98A;
    --success-soft: rgba(85,201,138,0.12);

    --danger: #E06B6B;
    --danger-soft: rgba(224,107,107,0.12);

    --warning: #D9A441;
    --warning-soft: rgba(217,164,65,0.12);

    --info: #6495ED;
    --info-soft: rgba(100,149,237,0.12);

    --gold: #C9A44C;
    --gold-soft: rgba(201,164,76,0.12);

 /* Borders */
    --border: rgba(255,255,255,0.08);
    --border-light: rgba(255,255,255,0.13);
    --border-gold: rgba(201,164,76,0.45);

/* Shadows */
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.18);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.28);
    --shadow-lg: 0 16px 50px rgba(0,0,0,0.40);

 /* Radius */
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --radius-xl: 24px;
    --radius-full: 999px;

    /* Spacing */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-8: 32px;
    --space-10: 40px;

    /* Typography */
    --font-xs: 12px;
    --font-sm: 14px;
    --font-md: 16px;
    --font-lg: 20px;
    --font-xl: 28px;
    --font-2xl: 36px;

    --weight-regular: 400;
    --weight-medium: 500;
    --weight-semibold: 600;
    --weight-bold: 700;

    /* Effects */
    --transition-fast: 0.15s ease;
    --transition: 0.25s ease;
    --transition-slow: 0.4s ease;

    /* Layout */
    --container-width: 1200px;
    --header-height: 72px;
    --sidebar-width: 260px;

    /* Overlay */
    --overlay: rgba(0,0,0,0.55);
    --blur: blur(12px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(160deg,var(--bg-0) 0%,var(--bg-1) 55%,var(--bg-0) 100%);
    font-family:"Segoe UI",-apple-system,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    padding:28px 16px;
  }
button {
    transition: all var(--transition);
}
  .card{
    width:100%;
    max-width:420px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:var(--radius-lg);
    padding:28px 26px 20px;
    backdrop-filter:blur(6px);
    animation:fadeIn .5s ease-out;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .arch{display:block;margin:0 auto 14px;opacity:.85;}

  .loc-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:2px;
  }
  .city{font-size:14px;color:var(--muted);}
  .date{font-size:12px;color:var(--muted-2);}

  
.hero{
  text-align:center;
  margin:16px 0 20px;
}

.next-sub{
  font-size:30px;
  font-weight:500;
  letter-spacing:-.5px;
  color:var(--ink-bright);
  margin-bottom:7px;
  line-height:1.15;
}

.next-label{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;

  margin-top:0;
  padding:6px 11px;

  font-size:13px;
  color:var(--gold);

  background:rgba(201,164,76,.08);
  border:1px solid rgba(201,164,76,.18);
  border-radius:var(--radius-full);

  transition:all .25s ease;
}

.next-label::before{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 8px rgba(201,164,76,.7);
  animation:pulse 1.8s infinite;
}

@keyframes pulse{
  0%,100%{
    opacity:.45;
    transform:scale(.8);
  }
  50%{
    opacity:1;
    transform:scale(1.15);
  }
}

.clock{
  margin-top:9px;
  font-family:Georgia,"Constantia","Times New Roman",serif;
  font-size:27px;
  font-variant-numeric:tabular-nums;
  letter-spacing:-1px;
  line-height:1;
  color:var(--muted);
}



.lang-row{
  display:flex;
  justify-content:flex-end;
  gap:6px;
  margin:0 0 10px;
}
.lang-btn{
  background:var(--panel);
  color:var(--muted);
  border:1px solid var(--panel-border);
  border-radius:999px;
  padding:4px 11px;
  font-size:11px;
  font-weight:600;
  letter-spacing:.03em;
  font-family:inherit;
  cursor:pointer;
}
.lang-btn:hover{ background:var(--panel-hover); color:var(--ink); }
.lang-btn.active{
  background:var(--gold-soft);
  border-color:var(--border-gold);
  color:var(--gold);
}

.greeting{
  text-align:center;
  margin:0 0 14px;
  padding:9px 12px;
  font-size:15px;
  font-weight:600;
  color:var(--gold);
  background:var(--gold-soft);
  border:1px solid var(--border-gold);
  border-radius:var(--radius-md);
}

  .divider{height:1px;background:var(--panel-border);margin:6px 0 14px;}

  .list{position:relative;padding-left:20px;}
  .list::before{
    content:"";
    position:absolute;
    left:5px;top:8px;bottom:8px;
    width:1px;
    background:linear-gradient(to bottom, var(--muted-2), transparent);
  }
  .row{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 4px 9px 14px;
    border-radius:10px;
  }
  .row .dot{
    position:absolute;left:-19px;top:50%;
    transform:translateY(-50%);
    width:9px;height:9px;border-radius:50%;
    background:var(--muted-2);
    border:2px solid var(--bg-1);
  }
  .row.info .dot{background:transparent;border:1.5px solid var(--muted-2);}
  .row.past .name, .row.past .time{color:var(--muted);}
  .row.next{background:var(--gold-soft);}
  .row.next .dot{
    background:var(--gold);
    box-shadow:0 0 0 4px rgba(201,164,76,0.18);
  }
  .row.next{
  background:
    linear-gradient(
      90deg,
      rgba(201,164,76,.14),
      rgba(201,164,76,.055)
    );

  border:1px solid rgba(201,164,76,.20);

  box-shadow:
    inset 3px 0 0 var(--gold),
    0 4px 14px rgba(0,0,0,.08);

  transform:translateX(2px);
}

.row.next .dot{
  background:var(--gold);

  box-shadow:
    0 0 0 4px rgba(201,164,76,.16),
    0 0 12px rgba(201,164,76,.25);
}

.row.next .name{
  color:var(--gold);
  font-weight:600;
}

.row.next .time{
  color:#fff;
  font-weight:600;
}
.row{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:9px 4px 9px 14px;
  border-radius:10px;

  transition:
    background .25s ease,
    transform .25s ease,
    border .25s ease;
}
  .name{font-size:15px;}
  .row.info .name{color:var(--muted);font-size:13px;}
  .time{
    font-family:Georgia,"Constantia",serif;
    font-size:17px;
    font-variant-numeric:tabular-nums;
  }
  .row.info .time{font-size:14px;color:var(--muted);}

  .note{font-size:11px;color:var(--muted-2);text-align:center;margin-top:16px;line-height:1.5;}

  .alert-bar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin:0 0 14px;padding:10px 12px;
    font-size:13px;line-height:1.4;color:var(--ink);
    background:var(--gold-soft);
    border:1px solid var(--border-gold);
    border-radius:var(--radius-md);
  }
  .alert-bar[hidden]{display:none;}
  .alert-bar button, .btn{
    flex:0 0 auto;
    background:var(--panel);
    color:var(--ink);
    border:1px solid var(--border-gold);
    border-radius:8px;
    padding:7px 12px;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
  }
  .alert-bar button[hidden]{display:none;}
  .alert-bar button:hover, .btn:hover{background:var(--panel-hover);}

  .section-title{
    font-size:12px;color:var(--gold);letter-spacing:.04em;
    margin:18px 0 6px;padding-top:14px;
    border-top:1px solid var(--panel-border);
  }
  .switch-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:8px 0;cursor:pointer;
  }
  .sw-text{display:flex;flex-direction:column;gap:2px;}
  .sw-title{font-size:14px;color:var(--ink);}
  .sw-sub{font-size:11px;color:var(--muted);line-height:1.4;}
  .switch{position:relative;flex:0 0 auto;width:42px;height:24px;}
  .switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1;}
  .switch .track{
    position:absolute;inset:0;border-radius:999px;
    background:rgba(255,255,255,0.14);transition:background .2s;
  }
  .switch .track::after{
    content:"";position:absolute;top:3px;left:3px;
    width:18px;height:18px;border-radius:50%;
    background:#fff;transition:transform .2s;
  }
  .switch input:checked + .track{background:var(--gold);}
  .switch input:checked + .track::after{transform:translateX(18px);}
  .switch input:focus-visible + .track{outline:2px solid var(--gold);outline-offset:2px;}
  .notify-status{font-size:11px;color:var(--warning);line-height:1.5;margin:4px 0 8px;}
  .notify-status:empty{display:none;}
  .notify-foot{font-size:11px;color:var(--muted-2);line-height:1.5;margin-top:8px;}

  .settings-toggle{
    display:flex;align-items:center;justify-content:center;gap:6px;
    margin-top:14px;padding:8px;
    font-size:12px;color:var(--muted);
    cursor:pointer;user-select:none;
    border-top:1px solid var(--panel-border);
  }
  .settings-toggle:hover{color:var(--ink);}
  .settings{
    display:none;
    margin-top:12px;
    padding-top:4px;
  }
  .settings.open{display:block;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
  select{
    width:100%;
    background:#0D1526;
    color:var(--ink);
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:8px 10px;
    font-size:13px;
    font-family:inherit;
  }

.sky-icon{
  position:relative;
  width:90px;
  height:48px;
  margin:0 auto 10px;
  overflow:hidden;
}

.sky-icon::before{
  content:"";
  position:absolute;
  left:8px;
  right:8px;
  bottom:-35px;
  height:70px;
  border:1px solid rgba(201,164,76,.65);
  border-radius:50% 50% 0 0;
}

.sun-or-moon{
  position:absolute;
  left:50%;
  top:8px;
  transform:translateX(-50%);
  width:24px;
  height:24px;
  border-radius:50%;
  background:#C9A44C;
  box-shadow:
    0 0 12px rgba(201,164,76,.35),
    0 0 28px rgba(201,164,76,.12);
}

.star{
  position:absolute;
  color:#C9A44C;
  opacity:.7;
  font-size:11px;
}

.star-1{
  left:16px;
  top:8px;
}

.star-2{
  right:18px;
  top:17px;
  font-size:18px;
}

.star-3{
  right:30px;
  top:2px;
  font-size:7px;
}
</style>
</head>
<body>
  <div class="card">
    <div class="lang-row" id="langRow">
      <button type="button" class="lang-btn" data-lang="kk">ҚАЗ</button>
      <button type="button" class="lang-btn" data-lang="en">ENG</button>
      <button type="button" class="lang-btn" data-lang="ru">РУС</button>
    </div>

    <div class="sky-icon" id="skyIcon">
  <div class="sun-or-moon"></div>
  <div class="star star-1">✦</div>
  <div class="star star-2">·</div>
  <div class="star star-3">✦</div>
</div>

    <div class="greeting" id="greeting" hidden>Жұма қабыл болсын!</div>

    <div class="alert-bar" id="alertBar" hidden>
      <span id="alertText"></span>
      <button type="button" id="alertBtn" hidden></button>
    </div>

    <div class="loc-row">
      <span class="city" id="cityLabel">Алматы қаласы</span>
      <span class="date" id="dateLabel">—</span>
    </div>

    <div class="hero">
     <div class="next-sub" id="nextSub"></div>
     <div class="next-label" id="nextLabel">Есептелуде…</div>
     <div class="clock" id="clock">--:--:--</div>
</div>

    <div class="divider"></div>

    <div class="list" id="list"></div>

    <div class="note" id="noteText">ҚМДБ ресми кестесімен калибрленген (Алматы/Астана деректерімен тексерілді).<br>Дәлдігі шамамен ±1-2 минут.</div>

    <div class="settings-toggle" id="settingsToggle">⚙ Баптаулар</div>
    <div class="settings" id="settingsPanel">
      <div class="field">
        <label for="citySelect" id="cityFieldLabel">Қала</label>
        <select id="citySelect"></select>
      </div>
      <div class="field">
        <label for="methodSelect" id="methodFieldLabel">Есептеу әдісі</label>
        <select id="methodSelect"></select>
      </div>
      <div class="field">
        <label for="madhabSelect" id="madhabFieldLabel">Екінті уақыты (мазһаб)</label>
        <select id="madhabSelect">
          <option value="2" id="hanafiOpt">Ханафи</option>
          <option value="1" id="shafiiOpt">Шафии / Малики / Ханбали</option>
        </select>
      </div>

      <div class="section-title" id="notifSectionTitle">ХАБАРЛАМАЛАР</div>
      <label class="switch-row">
        <span class="sw-text">
          <span class="sw-title" id="notifySwTitle">Хабарлама жіберу</span>
          <span class="sw-sub" id="notifySwSub">Намазға 10 және 5 минут қалғанда және уақыты кіргенде</span>
        </span>
        <span class="switch"><input type="checkbox" id="notifyToggle"><span class="track"></span></span>
      </label>
      <label class="switch-row">
        <span class="sw-text">
          <span class="sw-title" id="soundSwTitle">Азан дауысы</span>
          <span class="sw-sub" id="soundSwSub">Намаз уақыты кіргенде ойнайды</span>
        </span>
        <span class="switch"><input type="checkbox" id="soundToggle"><span class="track"></span></span>
      </label>
      <div class="notify-status" id="notifyStatus"></div>
      <button type="button" class="btn" id="testBtn">Сынау</button>
      <div class="notify-foot" id="notifyFoot">Хабарлама мен азан бет браузерде ашық тұрғанда ғана жұмыс істейді.</div>
    </div>
  </div>

<script>
// ---------- Деректер: қалалар мен әдістер ----------
const CITIES = [
  {key:'almaty',   lat:43.2220, lon:76.8512, name:{kk:"Алматы",  en:"Almaty",   ru:"Алматы"}},
  {key:'shymkent', lat:42.3417, lon:69.5901, name:{kk:"Шымкент", en:"Shymkent", ru:"Шымкент"}},
  {key:'aktobe',   lat:50.2839, lon:57.1670, name:{kk:"Ақтөбе",  en:"Aktobe",   ru:"Актобе"}},
  {key:'oral',     lat:51.2333, lon:51.3667, name:{kk:"Орал",    en:"Oral",     ru:"Уральск"}},
];
function cityName(city){ return city.name[lang]; }

// ҚМДБ (Қазақстан Мұсылмандары Діни Басқармасы) ресми кестесімен
// Алматы (14.09.2026) және Астана (01.09.2026) деректері бойынша калибрленген:
// Таң/Құптан бұрышы 15°/15°, Бесінге +3 мин, Күн шығуға -4 мин сақтық үлес (ихтият).
const METHODS = [
  {fajr:15,   isha:15,      ihtiyat:true,  name:{kk:"ҚМДБ (ресми кестеге жақын)", en:"Kazakhstan Muftiate (closest to official)", ru:"ДУМК (близко к официальному)"}},
  {fajr:18,   isha:17,      ihtiyat:false, name:{kk:"Дүниежүзілік мұсылмандар лигасы (MWL)", en:"Muslim World League (MWL)", ru:"Всемирная мусульманская лига (MWL)"}},
  {fajr:18,   isha:17,      ihtiyat:false, name:{kk:"Түркия (Diyanet)", en:"Turkey (Diyanet)", ru:"Турция (Diyanet)"}},
  {fajr:19.5, isha:17.5,    ihtiyat:false, name:{kk:"Каир (Египет)", en:"Cairo (Egypt)", ru:"Каир (Египет)"}},
  {fajr:18,   isha:18,      ihtiyat:false, name:{kk:"Карачи", en:"Karachi", ru:"Карачи"}},
  {fajr:18.5, isha:"90min", ihtiyat:false, name:{kk:"Умм-әл-Құра (Мекке)", en:"Umm al-Qura (Mecca)", ru:"Умм-эль-Кура (Мекка)"}},
];
function methodName(m){ return m.name[lang]; }

// Жұма намазының нақты уақыты (мешіт кестесі бойынша). Тек "Келесі намаз" көрсеткішінде
// қолданылады — бесін жолының өзі әрдайым есептелген уақытымен тұра береді.
// Деректер бар қалалар үшін ғана қолданылады.
const JUMA_TIMES = {
  almaty: "13:10",
};

// ---------- Тілдер ----------
const LANG_KEY = 'namaz-lang';
let lang = 'kk';
try { const saved = localStorage.getItem(LANG_KEY); if (saved && ['kk','en','ru'].includes(saved)) lang = saved; } catch(e){}
const LOCALE_MAP = { kk:'kk-KZ', en:'en-GB', ru:'ru-RU' };

const I18N = {
  kk: {
    pageTitle: 'Намазға уақыты болды',
    cityLabel: name => `${name} қаласы`,
    jumuahMubarak: 'Жұма қабыл болсын!',
    settingsLabel: 'Баптаулар',
    cityFieldLabel: 'Қала',
    methodFieldLabel: 'Есептеу әдісі',
    madhabFieldLabel: 'Екінті уақыты (мазһаб)',
    hanafiOption: 'Ханафи',
    shafiiOption: 'Шафии / Малики / Ханбали',
    notificationsSectionTitle: 'ХАБАРЛАМАЛАР',
    notifySwTitle: 'Хабарлама жіберу',
    notifySwSub: 'Намазға 10 және 5 минут қалғанда және уақыты кіргенде',
    soundSwTitle: 'Азан дауысы',
    soundSwSub: 'Намаз уақыты кіргенде ойнайды',
    testBtn: 'Сынау',
    notifyFoot: 'Хабарлама мен азан бет браузерде ашық тұрғанда ғана жұмыс істейді.',
    noteLine1: 'ҚМДБ ресми кестесімен калибрленген (Алматы/Астана деректерімен тексерілді).',
    noteLine2: 'Дәлдігі шамамен ±1-2 минут.',
    calculating: 'Есептелуде…',
    nextPrayerLabel: (name, time) => `Келесі намаз: ${name}, ${time}`,
    remainingH: (h,m) => `${h} сағ ${m} мин қалды`,
    remainingM: m => `${m} мин қалды`,
    remainingS: s => `${s} сек қалды`,
    fridayPrayerFull: 'Жұма намазы',
    prayerNames: {fajr:'Таң', sunrise:'Күн шығу', dhuhr:'Бесін', asr:'Екінті', maghrib:'Ақшам', isha:'Құптан', friday:'Жұма'},
    weekdays: ['Жексенбі','Дүйсенбі','Сейсенбі','Сәрсенбі','Бейсенбі','Жұма','Сенбі'],
    months: ['қаңтар','ақпан','наурыз','сәуір','мамыр','маусым','шілде','тамыз','қыркүйек','қазан','қараша','желтоқсан'],
    alertNow: name => `${name} намазының уақыты кірді`,
    alertBefore: (name, min) => `${name} намазына ${min} минут қалды`,

// ---------- Астрономиялық есептеу ----------
const toRad = d => d * Math.PI/180;
const toDeg = r => r * 180/Math.PI;

function julianDay(date){
  const utcNoon = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), 12, 0, 0);
  return utcNoon/86400000 + 2440587.5;
}

function sunPosition(jd){
  const T = (jd - 2451545.0)/36525;
  const L0 = (280.46646 + T*(36000.76983 + T*0.0003032)) % 360;
  const M = 357.52911 + T*(35999.05029 - 0.0001537*T);
  const e = 0.016708634 - T*(0.000042037 + 0.0000001267*T);
  const Mrad = toRad(M);
  const C = (1.914602 - T*(0.004817 + 0.000014*T))*Math.sin(Mrad)
          + (0.019993 - 0.000101*T)*Math.sin(2*Mrad)
          + 0.000289*Math.sin(3*Mrad);
  const trueLong = L0 + C;
  const omega = 125.04 - 1934.136*T;
  const appLong = trueLong - 0.00569 - 0.00478*Math.sin(toRad(omega));
  const eps0 = 23 + (26 + (21.448 - T*(46.815 + T*(0.00059 - T*0.001813)))/60)/60;
  const eps = eps0 + 0.00256*Math.cos(toRad(omega));
  const decl = Math.asin(Math.sin(toRad(eps))*Math.sin(toRad(appLong)));
  const y = Math.pow(Math.tan(toRad(eps/2)), 2);
  const L0r = toRad(L0);
  let eqTime = y*Math.sin(2*L0r) - 2*e*Math.sin(Mrad) + 4*e*y*Math.sin(Mrad)*Math.cos(2*L0r)
             - 0.5*y*y*Math.sin(4*L0r) - 1.25*e*e*Math.sin(2*Mrad);
  eqTime = toDeg(eqTime) * 4;
  return { decl, eqTime };
}

function hourAngleHours(zenithDeg, latDeg, decl){
  const lat = toRad(latDeg);
  const cosH = (Math.cos(toRad(zenithDeg)) - Math.sin(lat)*Math.sin(decl)) / (Math.cos(lat)*Math.cos(decl));
  const clamped = Math.max(-1, Math.min(1, cosH));
  return toDeg(Math.acos(clamped))/15;
}

function computeTimes(date, lat, lon, fajrAngle, ishaSpec, asrFactor, useIhtiyat){
  const jd = julianDay(date);
  const { decl, eqTime } = sunPosition(jd);
  const tz = -date.getTimezoneOffset()/60;
  const rawDhuhr = 12 - lon/15 + tz - eqTime/60;

  const dhuhrIhtiyatMin = useIhtiyat ? 3 : 0;
  const sunriseIhtiyatMin = useIhtiyat ? -4 : 0;
  const dhuhrDisp = rawDhuhr + dhuhrIhtiyatMin/60;

  const sunH = hourAngleHours(90.833, lat, decl);
  const fajrH = hourAngleHours(90 + fajrAngle, lat, decl);

  const latR = toRad(lat);
  const altAsr = Math.atan(1/(asrFactor + Math.tan(Math.abs(latR - decl))));
  const asrZenith = 90 - toDeg(altAsr);
  const asrH = hourAngleHours(asrZenith, lat, decl);

  const mk = h => {
    const d = new Date(date); d.setHours(0,0,0,0);
    return new Date(d.getTime() + h*3600*1000);
  };

  const maghrib = mk(dhuhrDisp + sunH);
  let isha;
  if (typeof ishaSpec === "number"){
    const ishaH = hourAngleHours(90 + ishaSpec, lat, decl);
    isha = mk(rawDhuhr + ishaH);
  } else {
    isha = new Date(maghrib.getTime() + 90*60*1000);
  }

  return {
    fajr: mk(rawDhuhr - fajrH),
    sunrise: mk(rawDhuhr - sunH + sunriseIhtiyatMin/60),
    dhuhr: mk(dhuhrDisp),
    asr: mk(dhuhrDisp + asrH),
    maghrib: maghrib,
    isha: isha,
  };
}

];

// Жұма күні ғана (жергілікті уақыт бойынша 00:00–23:59)
function isFriday(d){ return d.getDay() === 5; }

function fmtTime(d){
  return d.toLocaleTimeString(LOCALE_MAP[lang], {hour:'2-digit', minute:'2-digit', hour12:false});
}
function fmtClock(d){
  return d.toLocaleTimeString(LOCALE_MAP[lang], {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
}

let todayTimes = null;
let tomorrowFajr = null;
let jumaTime = null; // Жұма намазының нақты уақыты (тек жұмада, деректер бар қалада)

function renderAll(){
  const city = CITIES[citySelect.value];
  const method = METHODS[methodSelect.value];
  const asrFactor = parseInt(madhabSelect.value, 10);

  const now = new Date();
  todayTimes = computeTimes(now, city.lat, city.lon, method.fajr, method.isha, asrFactor, method.ihtiyat);

  jumaTime = null;
  const jumaHm = JUMA_TIMES[city.key];
  if (jumaHm && isFriday(now)){
    const [h,m] = jumaHm.split(':').map(Number);
    jumaTime = new Date(now); jumaTime.setHours(h,m,0,0);
  }

  const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate()+1);
  const tTimes = computeTimes(tomorrow, city.lat, city.lon, method.fajr, method.isha, asrFactor, method.ihtiyat);
  tomorrowFajr = tTimes.fajr;

  cityLabel.textContent = t('cityLabel')(cityName(city));
  dateLabel.textContent = `${t('weekdays')[now.getDay()]}, ${now.getDate()} ${t('months')[now.getMonth()]}`;

  renderList();
}

let nextPrayerName = null;
let nextPrayerTime = null;

// "Келесі намаз" анықтауға арналған уақыт: бесінге Жұма күні нақты Жұма уақыты бар болса, сол қолданылады.
function effectiveTime(key){
  return (key === 'dhuhr' && jumaTime) ? jumaTime : todayTimes[key];
}

function renderList(){
  const now = new Date();
  greetingEl.hidden = !isFriday(now);
  const targets = ['fajr','dhuhr','asr','maghrib','isha'];
  let nextKey = null;
  for(const k of targets){
    if(effectiveTime(k) > now){ nextKey = k; break; }
  }

  const names = t('prayerNames');
  listEl.innerHTML = '';
  ROW_KEYS.forEach(row=>{
    const time = todayTimes[row.key];
    const div = document.createElement('div');
    div.className = 'row' + (row.info ? ' info' : '') + (time < now ? ' past' : '') + (row.key===nextKey ? ' next' : '');
    div.innerHTML = `<span class="dot"></span><span class="name">${names[row.key]}</span><span class="time">${fmtTime(time)}</span>`;
    listEl.appendChild(div);
  });

  if (nextKey){
    nextPrayerName = (nextKey === 'dhuhr' && isFriday(now)) ? t('fridayPrayerFull') : names[nextKey];
    nextPrayerTime = effectiveTime(nextKey);
  } else {
    nextPrayerName = names.fajr;
    nextPrayerTime = tomorrowFajr;
  }

  updateCountdown();
}

function updateCountdown(){
  if (!nextPrayerTime) return;
  const now = new Date();
  const diffMs = nextPrayerTime - now;
  const totalSec = Math.max(0, Math.floor(diffMs / 1000));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;

  nextLabelEl.textContent = t('nextPrayerLabel')(nextPrayerName, fmtTime(nextPrayerTime));

  if (h > 0){
    nextSubEl.textContent = t('remainingH')(h, m);
  } else if (m > 0){
    nextSubEl.textContent = t('remainingM')(m);
  } else {
    nextSubEl.textContent = t('remainingS')(s);
  }
}

function tick(){
  clockEl.textContent = fmtClock(new Date());
  updateCountdown();
  checkAlerts();
}

function stopAzan(){

}

// azan.mp3 табылмаса, қарапайым қоңырау дыбысы шығады
function chime(){
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    [523.25, 659.25, 783.99].forEach((f,i)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      const t0 = ctx.currentTime + i*0.45;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.25, t0+0.05);
      g.gain.exponentialRampToValueAtTime(0.001, t0+1.2);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0+1.25);
    });
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 3000);
  } catch(e){}
}

function playAzan(){
  azan.muted = false;
  try { azan.currentTime = 0; } catch(e){}
  const p = azan.play();
  if (p && p.catch) p.catch(err=>{
    if (err && err.name === 'NotAllowedError'){
      // Браузер дыбысты өздігінен қосуға рұқсат бермеді — бір рет басу керек
      alertBar.hidden = false;
      clearTimeout(bannerTimer);
      setAlertBtn('play');
    } else {
      chime(); // файл жоқ немесе ойнатылмады
    }
  });
}

// Браузердің автоойнату шектеуін алдын ала «ашып қою» (пайдаланушы бетті басқанда)
function unlockAudio(){
  if (audioUnlocked || !settings.sound) return;
  audioUnlocked = true;
  azan.muted = true;
  const done = ()=>{ if (azan.muted){ azan.pause(); azan.currentTime = 0; azan.muted = false; } };
  let p;
  try { p = azan.play(); } catch(e){}
  if (p && p.then) p.then(done).catch(()=>{ azan.muted = false; audioUnlocked = false; });
  else done();
}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev, unlockAudio));

alertBtn.addEventListener('click', ()=>{
  if (alertBtn.dataset.mode === 'stop') stopAzan();
  else if (alertBtn.dataset.mode === 'play'){ setAlertBtn(null); playAzan(); }
});

// ----- Жүйелік хабарлама -----
async function sendNotification(title, body, tag){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const opts = {body, tag, renotify:true, vibrate:[200,100,200]};
  try {
    if ('serviceWorker' in navigator){
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg){ await reg.showNotification(title, opts); return; }
    }
  } catch(e){}
  try { new Notification(title, opts); } catch(e){}
}

function alertName(key){
  if (key === 'dhuhr' && isFriday(new Date())) return t('prayerNames').friday;
  return t('prayerNames')[key];
}

function fireAlert(key, offset, atTime){
  const name = alertName(key);
  const title = offset === 0 ? t('alertNow')(name) : t('alertBefore')(name, offset/60);
  const body = `${fmtTime(atTime)} · ${cityName(CITIES[citySelect.value])}`;
  showBanner(`${title} (${fmtTime(atTime)})`);
  if (settings.notify) sendNotification(title, body, `namaz-${key}-${offset}`);
  if (offset === 0 && settings.sound) playAzan();
}

function checkAlerts(){
  if (!todayTimes || (!settings.notify && !settings.sound)) return;
  const now = new Date();
  if (todayTimes.dhuhr.toDateString() !== now.toDateString()) renderAll(); // жаңа күн — қайта есептеу
  for (const key of ALERT_PRAYERS){
    const when = effectiveTime(key);
    for (const off of ALERT_OFFSETS){
      const late = (now.getTime() - (when.getTime() - off*1000)) / 1000;
      if (late < 0 || late >= ALERT_WINDOW) continue;
      const id = ymd(now) + '-' + key + '-' + off;
      if (fired.has(id)) continue;
      fired.add(id); saveFired();
      fireAlert(key, off, when);
    }
  }
}

  let msg = '';
  if (!('Notification' in window)){
    msg = t('notifNotSupported');
  } else if (Notification.permission === 'denied'){
    msg = t('notifDenied');
  }
  notifyStatus.textContent = msg;
}

notifyToggle.addEventListener('change', async ()=>{
  if (notifyToggle.checked){
    if ('Notification' in window && Notification.permission !== 'granted'){
      let perm = Notification.permission;
      if (perm !== 'denied'){
        try { perm = await Notification.requestPermission(); } catch(e){}
      }
      if (perm !== 'granted'){
        notifyToggle.checked = false;
        settings.notify = false;
        saveSettings(); updateNotifyStatus();
        return;
      }
    }
    settings.notify = true;
  } else {
    settings.notify = false;
  }
  saveSettings(); updateNotifyStatus();
});

soundToggle.addEventListener('change', ()=>{
  settings.sound = soundToggle.checked;
  saveSettings();
  if (settings.sound) unlockAudio(); else stopAzan();
});

testBtn.addEventListener('click', ()=>{
  showBanner(t('testBanner'));
  if (settings.notify) sendNotification(t('testNotifTitle'), t('testNotifBody'), 'namaz-test');
  if (settings.sound) playAzan();
});

// ----- Тілді қолдану -----
function applyStaticText(){
  document.title = t('pageTitle');
  document.documentElement.lang = lang;
  greetingEl.textContent = t('jumuahMubarak');
  settingsToggle.textContent = '⚙ ' + t('settingsLabel');
  cityFieldLabel.textContent = t('cityFieldLabel');
  methodFieldLabel.textContent = t('methodFieldLabel');
  madhabFieldLabel.textContent = t('madhabFieldLabel');
  hanafiOpt.textContent = t('hanafiOption');
  shafiiOpt.textContent = t('shafiiOption');
  notifSectionTitle.textContent = t('notificationsSectionTitle');
  notifySwTitleEl.textContent = t('notifySwTitle');
  notifySwSubEl.textContent = t('notifySwSub');
  soundSwTitleEl.textContent = t('soundSwTitle');
  soundSwSubEl.textContent = t('soundSwSub');
  testBtn.textContent = t('testBtn');
  notifyFootEl.textContent = t('notifyFoot');
  noteTextEl.innerHTML = `${t('noteLine1')}<br>${t('noteLine2')}`;
  nextLabelEl.textContent = t('calculating');
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  updateNotifyStatus();
}

function setLang(newLang){
  lang = newLang;
  try { localStorage.setItem(LANG_KEY, lang); } catch(e){}
  applyStaticText();
  populateSelects();
  renderAll();
}

madhabSelect.value = "2"; // Ханафи
setLang(lang);
tick();
setInterval(tick, 1000);
setInterval(renderList, 30000);
setInterval(renderAll, 3600000);
